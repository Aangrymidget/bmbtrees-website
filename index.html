<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John's B.M.B Tree Service | Professional Arborist Care – Gulf Coast</title>
  <meta name="description" content="Local hands, honest work & professional arborist care. Safe tree removal, trimming, and storm damage cleanup. Call (228) 213-3019.">
  <meta property="og:title" content="John's B.M.B Tree Service">
  <meta property="og:description" content="Local hands, honest work & professional arborist care on the Gulf Coast.">
  <meta property="og:type" content="website">

  <style>
    :root {
      --green-dark: #1b4332;
      --green: #2d6a4f;
      --green-light: #40916c;
      --cream: #f8f9f5;
      --text: #1a1a1a;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--cream);
    }

    header {
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      color: var(--white);
      text-align: center;
      padding: 2.5rem 1.25rem 2rem;
    }

    header h1 {
      font-size: clamp(1.75rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.95;
      max-width: 32rem;
      margin: 0 auto;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
    }

    .slider-container {
      position: relative;
      width: 100%;
      height: 340px;
      margin: 1.75rem 0 2rem;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #ddd;
    }

    .slider-container img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    .slider-container img.active {
      opacity: 1;
      z-index: 1;
    }

    .cta-box {
      background: var(--white);
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 2.5rem;
      border-top: 4px solid var(--green);
    }

    .cta-box p {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: var(--green-dark);
    }

    .btn {
      display: inline-block;
      background: var(--green);
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 0.85rem 1.6rem;
      border-radius: 8px;
      margin: 0.4rem;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 2px 8px rgba(45, 106, 79, 0.3);
      border: none;
      cursor: pointer;
    }

    .btn:hover, .btn:focus {
      background: var(--green-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #1d3557;
      box-shadow: 0 2px 8px rgba(29, 53, 87, 0.25);
    }

    .btn-secondary:hover, .btn-secondary:focus {
      background: #14253d;
    }

    /* Axe CTA – clickable image */
    .axe-cta {
      display: block;
      margin: 0 auto 1.5rem;
      max-width: 420px;
      width: 100%;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .axe-cta:hover,
    .axe-cta:focus {
      transform: scale(1.03);
      box-shadow: 0 8px 28px rgba(0,0,0,0.18);
      outline: none;
    }

    .axe-cta:active {
      transform: scale(0.98);
    }

    .axe-cta img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    .section-title {
      text-align: center;
      font-size: 1.6rem;
      color: var(--green-dark);
      margin: 2.5rem 0 1.5rem;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .service-card {
      background: var(--white);
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .service-card h3 {
      color: var(--green);
      margin-bottom: 0.5rem;
      font-size: 1.15rem;
    }

    .service-card p {
      font-size: 0.95rem;
      color: #444;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      background: var(--green-dark);
      color: rgba(255,255,255,0.85);
      font-size: 0.9rem;
    }

    footer a {
      color: #a7c957;
      text-decoration: none;
    }

    /* Quote panel */
    .quote-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1001;
      background: var(--white);
      box-shadow: 0 -6px 24px rgba(0,0,0,0.2);
      border-top: 3px solid var(--green);
      transform: translateY(100%);
      transition: transform 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    .quote-panel.open {
      transform: translateY(0);
    }

    .quote-panel-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0.85rem 1rem 1rem;
      position: relative;
    }

    .quote-panel h2 {
      font-size: 1rem;
      color: var(--green-dark);
      text-align: center;
      margin-bottom: 0.65rem;
      font-weight: 600;
    }

    .quote-close {
      position: absolute;
      top: 0.5rem;
      right: 0.75rem;
      background: none;
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      color: #666;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
    }

    .quote-close:hover {
      color: var(--green-dark);
    }

    .quote-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr auto;
      gap: 0.4rem 0.5rem;
      align-items: end;
    }

    .quote-form label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--green-dark);
      margin-bottom: 0.15rem;
      line-height: 1.2;
    }

    .quote-form input[type="text"],
    .quote-form input[type="tel"] {
      width: 100%;
      padding: 0.4rem 0.55rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.85rem;
      font-family: inherit;
      background: #fafafa;
      transition: border-color 0.2s;
      height: 2.1rem;
    }

    .quote-form input:focus {
      outline: none;
      border-color: var(--green);
      background: #fff;
    }

    .form-actions .btn {
      margin: 0;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      white-space: nowrap;
      height: 2.1rem;
      line-height: 1.2;
    }

    .form-note {
      font-size: 0.68rem;
      color: #777;
      text-align: center;
      margin-top: 0.4rem;
      grid-column: 1 / -1;
    }

    .quote-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .quote-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 700px) {
      .slider-container { height: 260px; }
      .btn { display: block; width: 100%; max-width: 320px; margin: 0.5rem auto; }
      .axe-cta { max-width: 320px; }

      .quote-form {
        grid-template-columns: 1fr;
        gap: 0.45rem;
      }

      .form-actions .btn {
        width: 100%;
        height: auto;
        padding: 0.6rem 1rem;
      }
    }
  </style>
</head>
